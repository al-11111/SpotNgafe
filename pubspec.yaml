name: spot_ngafe
description: "Aplikasi rekomendasi kafe terdekat untuk mahasiswa nugas di Malang berbasis Flutter dan Dart."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
